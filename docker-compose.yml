services:
  postgres:
    image: postgres:16.4-alpine3.20
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_DB: ${DATABASE_DB:-project_db}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-Password1234}
    env_file:
      - path: ./.env
        required: true
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_DB:-project_db}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  firebase-emulator:
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile.firebase-emulator
    network_mode: host
    # /emulator/v1/projects/<id>/config is the documented ready probe; the
    # bare root is an HTML landing page whose status is not contractually 200.
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-fsS',
          'http://localhost:9099/emulator/v1/projects/${FIREBASE_PROJECT_ID:-maintenance-tracker-e2e}/config',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    ports:
      - '${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}'
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile.backend
    network_mode: host
    env_file: ./.env
    # node -e because the backend image is slim and has no curl/wget.
    # GET / returns 200 from the app controller's health-check endpoint.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:'+(process.env.BACKEND_PORT||3001)+'/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      firebase-emulator:
        condition: service_healthy
    develop:
      watch:
        - path: ./backend/src
          target: /app/backend/src
          action: sync
        - path: ./packages
          target: /app/packages
          action: sync

  db-migration-service:
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile.db-migration
    env_file:
      - ./.env
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy

  client:
    ports:
      - '${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}'
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile.frontend
    network_mode: host
    env_file:
      - ./.env
    # Next.js dev server takes longer to become ready than the backend;
    # generous start_period avoids early failures while Turbopack warms up.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:'+(process.env.FRONTEND_PORT||3000)+'/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    develop:
      watch:
        - path: ./frontend/src
          target: /app/frontend/src
          action: sync
        - path: ./packages
          target: /app/packages
          action: sync+restart

  worker:
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile.background-job
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      firebase-emulator:
        condition: service_healthy
    develop:
      watch:
        - path: ./backend/src
          target: /app/backend/src
          action: sync
        - path: ./packages
          target: /app/packages
          action: sync
